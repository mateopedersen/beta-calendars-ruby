name: Release Ruby gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build beta_calendars.gemspec
      - uses: rubygems/release-gem@v1
      - name: Install the public release and smoke-test it
        run: |
          gem install beta_calendars --version "${GITHUB_REF_NAME#v}" --no-document
          ruby -e 'require "beta_calendars"; abort unless BetaCalendars.month(year: 2027, month: 1).days.length == 31; puts "beta_calendars #{BetaCalendars::VERSION} install smoke test passed"'
